# Full local Crypt stack. From the repository root:
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Then ingest data and build the index with `make ingest`.

name: crypt

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: crypt
      POSTGRES_PASSWORD: crypt
      POSTGRES_DB: crypt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Host port 5433 avoids colliding with a locally-installed PostgreSQL.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  embed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.embed
    # Shared with the backend so `make ingest` can write the embeddings file
    # the index builder consumes.
    volumes:
      - ../data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      DATABASE_URL: postgres://crypt:crypt@postgres:5432/crypt
      REDIS_URL: redis://redis:6379
      EMBED_SERVICE_URL: http://embed:8000
      INDEX_PATH: /app/data/crypt.index
      REST_ADDR: 0.0.0.0:8080
      GRPC_ADDR: 0.0.0.0:50051
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      RUST_LOG: info
      LOG_FORMAT: json
    volumes:
      - ../data:/app/data
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - server

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../observability/otel-collector.yml:/etc/otel/config.yaml:ro
    ports:
      - "8889:8889"
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - server

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
