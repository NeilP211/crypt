# Prometheus scrape configuration for the Crypt stack.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The backend exposes metrics directly at /metrics.
  - job_name: crypt-server
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8080"]

  # The OpenTelemetry Collector re-exports the same metrics, and is the
  # ingestion point for OTLP traces.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
