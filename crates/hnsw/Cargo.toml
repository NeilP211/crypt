[package]
name = "hnsw"
version = "0.1.0"
description = "From-scratch Hierarchical Navigable Small World index for approximate nearest-neighbor search"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "recall_latency"
harness = false

[[bin]]
name = "hnsw-report"
path = "src/bin/report.rs"

[lib]
name = "hnsw"
path = "src/lib.rs"
