[project]
name = "crypt-ingest"
version = "0.1.0"
description = "Data ingestion for Crypt: OpenStreetMap scraping, CLIP embeddings, PostGIS loading"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "psycopg[binary]>=3.1",
    "numpy>=1.24",
    "pillow>=10.0",
    "open-clip-torch>=2.24",
    "torch>=2.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
crypt-ingest = "crypt_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crypt_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
